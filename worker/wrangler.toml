# Fledglings school-wide AI coach — Cloudflare Worker.
# Serves the floating chat widget (GET /widget.js) and the coach API
# (POST /api/coach) for the LearnWorlds school at fledglings.co.

name = "fledglings-coach"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Nightly early-warning refresh (03:10 UTC) — keeps the portal instant
# and the engagement trend history accruing. The hourly tick is the
# rolling roster: a slice of learners refreshed per tick, so the
# dashboard reads a warm store and the API never sees a burst. Hourly
# rather than every five minutes because the measured load showed no
# reason to sit anywhere near the provider's rate limit for data that
# changes a few times a day.
[triggers]
# Nightly heavy jobs at 03:10; the data roster refreshes twice a day
# (providers press Refresh on the dashboard for anything sooner).
# The Monday 06:00 UTC firing pre-runs the weekly safeguarding deep
# read (7am UK in summer, 6am in winter) so it is warm before staff
# arrive; nothing else - including the Refresh button - triggers it.
crons = ["10 3 * * *", "0 */12 * * *", "0 6 * * 1"]

# Self service binding: lets the cron fan each heavyweight data pull
# out into its own invocation (a worker cannot fetch its own public
# URL, and one invocation's subrequest budget no longer covers a
# 200-learner tick in one go).
[[services]]
binding = "SELF"
service = "fledglings-coach"

[vars]
# Kill switch — set to "true" to make the coach return its authored
# fallback for every request (widget stays up, model calls stop).
COACH_DISABLED = "false"

# Bumped on every meaningful change so behaviour can be traced back
# to the deploying version.
WORKER_VERSION = "0.1.0"

# Cost levers — same convention as the fledglings-feedback worker.
# Coach replies use Sonnet (the proven tier for the SCORM coach);
# the moderation pre-pass uses Haiku. Override either without a
# redeploy via `wrangler secret put`.
COACH_MODEL = "claude-sonnet-4-6"
MODERATION_MODEL = "claude-haiku-4-5"

# KV — rate-limit counters (per-learner daily + per-session).
# After `wrangler kv namespace create RATE_LIMITS`, paste the id
# printed by the CLI into this block.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "cbaee95911f54d1b8dd70acfe1d83b8b"

# Inline-text loader — prompts and the widget source ship as
# version-controlled text files imported at build time.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[observability]
enabled = true
