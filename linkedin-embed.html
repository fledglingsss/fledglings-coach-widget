<div id="fl-linkedin" style="width:100%;"></div>
<script>
  (function () {
    var email = "{{USER.EMAIL}}";
    var origin = "https://fledglings-coach.fledglings.workers.dev";
    var src = origin + "/linkedin";
    if (email && email.indexOf("{{") === -1 && email.indexOf("@") !== -1) {
      var b64 = btoa(unescape(encodeURIComponent(email)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      src += "?e=" + b64;
    }
    var frame = document.createElement("iframe");
    frame.src = src;
    frame.title = "LinkedIn Optimizer";
    frame.style.cssText =
      "width:100%;height:1500px;border:none;border-radius:12px;display:block;";
    frame.setAttribute("loading", "lazy");
    frame.setAttribute("allow", "clipboard-write");
    document.getElementById("fl-linkedin").appendChild(frame);
  })();
</script>
