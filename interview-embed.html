<div id="fl-interview" style="width:100%;"></div>
<script>
  (function () {
    var frame = document.createElement("iframe");
    frame.src = "https://fledglings-coach.fledglings.workers.dev/interview";
    frame.title = "Interview Studio — video mock interview with Fledge";
    frame.style.cssText =
      "width:100%;height:1600px;border:none;border-radius:12px;display:block;";
    frame.setAttribute("loading", "lazy");
    frame.setAttribute("allow", "camera; microphone");
    document.getElementById("fl-interview").appendChild(frame);
  })();
</script>
