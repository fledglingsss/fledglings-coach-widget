<!-- ============================================================
  Fledglings coach — LearnWorlds paste-in snippet.

  WHERE: LearnWorlds admin → Site Builder → Settings (gear) →
  Custom Code → "Before the closing of the BODY tag" (the GLOBAL
  body-end slot — NOT the head slot: LearnWorlds does not inject
  head-slot code inside the course player, body-slot code runs
  everywhere including the player).

  The worker URL below is the live deployment — paste this file's
  contents as-is.

  {{USER.NAME}} is a LearnWorlds Liquid variable — it is replaced
  with the logged-in learner's name at render time and used only
  to greet the learner. The widget sends no other personal data
  and stores the conversation only in the learner's own browser.
  ============================================================ -->
<script>
  window.FLEDGLINGS_COACH = {
    endpoint: "https://fledglings-coach.fledglings.workers.dev",
    learnerName: "{{USER.NAME}}",
    learnerEmail: "{{USER.EMAIL}}"
  };
</script>
<script src="https://fledglings-coach.fledglings.workers.dev/widget.js" defer></script>
