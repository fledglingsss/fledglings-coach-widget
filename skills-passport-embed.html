<!-- ============================================================
  Fledglings Skills Passport — LearnWorlds embed snippet.

  WHERE: create a page for logged-in learners (or an embed activity
  inside a course) and paste this into a Custom Code / HTML block.

  HOW IT WORKS: LearnWorlds replaces {{USER.EMAIL}} with the
  logged-in learner's email when it serves the page, so every
  learner automatically sees their own passport — scores, streak,
  badges, and their cohort (from their LearnWorlds tag) are then
  looked up server-side. If Liquid isn't substituted (e.g. a
  logged-out preview), the sample passport shows instead.
  ============================================================ -->
<div id="fl-skills-passport" style="width:100%;"></div>
<script>
  (function () {
    var email = "{{USER.EMAIL}}";
    var base = "https://fledglings-coach.fledglings.workers.dev/skills-passport";
    var src =
      email && email.indexOf("{{") === -1 && email.indexOf("@") !== -1
        ? base + "?email=" + encodeURIComponent(email)
        : base + "?demo=1";
    var frame = document.createElement("iframe");
    frame.src = src;
    frame.title = "My Skills Passport";
    frame.style.cssText =
      "width:100%;height:1500px;border:none;border-radius:12px;display:block;";
    frame.setAttribute("loading", "lazy");
    document.getElementById("fl-skills-passport").appendChild(frame);
  })();
</script>
